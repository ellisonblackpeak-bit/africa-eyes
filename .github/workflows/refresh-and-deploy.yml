name: refresh-and-deploy

# 07:00 / 10:00 / 13:00 / 16:00 / 19:00 / 22:00 / 01:00 / 04:00 (Beijing, UTC+8)
# GitHub Actions cron is UTC, hence the -8h shift: 23,02,05,08,11,14,17,20.
on:
  schedule:
    - cron: "0 23,2,5,8,11,14,17,20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: africa-eyes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh data
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          # MiniMax-M3 is the translation model. It is reachable from the runner
          # and cheaper per character than Grok; XAI_API_KEY stays as the
          # documented fallback in translate_xai.py.
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_MODEL: ${{ secrets.MINIMAX_MODEL }}
          MINIMAX_BASE_URL: ${{ secrets.MINIMAX_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          # The whole key pool in one comma-separated string; sources.py rotates
          # down it whenever a key reports its quota is spent.
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          # Tavily + xAI are the primary channels — run them on every cycle.
          # The old 6-hour cooldown is gone now that several keys are available.
          TAVILY_MIN_INTERVAL: "0"
          PYTHONIOENCODING: utf-8
        run: |
          # keep the article cache bounded so the repo does not grow forever
          find data/raw -type f -mtime +7 -delete 2>/dev/null || true
          # Runtime bookkeeping files must never persist: a committed cooldown
          # mark is re-checked-out with a fresh mtime, which used to make Tavily
          # look like it had just run on every cloud pass.
          rm -f data/raw/_tav_mark data/raw/_tavily_last.txt \
                data/raw/_tavily_quota_dead data/raw/_tavily_key_state.json || true
          python fetch_news.py || echo "::warning::fetch_news failed"
          python fetch_articles.py || echo "::warning::fetch_articles failed"
          python fetch_social_x.py || echo "::warning::fetch_social_x failed"
          python build_data.py
          # Drain the translation queue, not just its first N items.
          #
          # `--limit 220` was the reason the 展开全文 panel kept showing English:
          # build_data queues titles → summaries → bodies, a 3-hour round holds
          # far more than 220 strings, so the bodies at the tail were never
          # reached. The page then fell back to "译文生成中，暂显示原文" on most
          # cards even though the translation step reported success.
          # A character budget still bounds the cost, and looping clears the
          # rest of the queue in the same run.
          for round in 1 2 3; do
            python translate_xai.py --chars 300000 | tee /tmp/tr.log \
              || { echo "::warning::translate failed"; break; }
            grep -q NEXT_ROUND_NEEDED /tmp/tr.log || break
            echo "::notice::translation round $round left a tail — continuing"
          done
          python build_data.py
          rm -f data/raw/_tavily_last.txt data/raw/_tavily_quota_dead \
                data/raw/_tavily_key_state.json || true

      - name: Commit refreshed data
        run: |
          git config user.name  "africa-eyes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data data.js
          if git diff --cached --quiet; then
            echo "no data change"
            exit 0
          fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          # A code commit may have landed while this 40-minute job was running
          # (a manual push, another workflow). A plain `git push` would then be
          # rejected as non-fast-forward and the freshly fetched data — the whole
          # point of the run — would be thrown away, as happened on 2026-10-20.
          # Rebase onto the branch tip and keep OUR data files on conflict.
          git -c rebase.autoStash=true pull --rebase -X ours origin main || {
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase -X ours origin main
          }
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The refresh job pushes a NEW commit on top of the triggering SHA, so the
      # deploy job must check out the branch tip (ref: main), not github.sha —
      # otherwise it ships the data from before the refresh.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Assemble site
        run: |
          mkdir -p _site
          # 两个 workflow 的这一步必须逐字一致：任何一方少拷一个文件，
          # 它部署一次就会把那个文件从线上抹掉（曾因此让图标 404）。
          cp index.html data.js sw.js manifest.json _site/
          cp *.png _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
