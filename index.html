<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020C1A">
<!-- iOS 独立模式下的状态栏底色；与地球页一致，避免顶部出现一条深蓝色带 -->
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#020C1A">
<meta name="msapplication-TileColor" content="#020C1A">
<title>China Eyes · 中国全球动态监测台</title>
<!-- Add-to-home-screen: Android Chrome reads manifest.json (any + maskable);
     iOS Safari reads apple-touch-icon (and the -precomposed variant disables
     its built-in gloss/round-corner overlay). All icons are OPAQUE PNGs so
     the eye graphic is preserved on install. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon-precomposed.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="China Eyes">
<meta name="application-name" content="China Eyes">
<style>
:root{
  --bg:#eef2f6; --card:#ffffff; --ink:#14212e; --ink2:#4a5c6e; --ink3:#7b8b9c;
  --line:#dde5ec; --line2:#eaf0f5;
  --accent:#0F3D5C; --accent2:#17628F; --teal:#12756A;
  --pol:#2F5D8C; --eco:#12756A; --sec:#B4351F; --ene:#A87418; --min:#6B4E9E;
  --shadow:0 1px 2px rgba(16,42,64,.06),0 6px 18px rgba(16,42,64,.07);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- shell ---------- */
.wrap{max-width:780px;margin:0 auto;padding:0 14px 96px}

header.top{
  background:linear-gradient(160deg,#0F3D5C 0%,#164E73 55%,#12756A 140%);
  color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 0 20px;
  margin-bottom:-14px;padding-bottom:34px;
}
header.top .inner{max-width:780px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:9px;font-size:12.5px;letter-spacing:.16em;
  text-transform:uppercase;color:#9fc6de;font-weight:600}
.brand .dot{width:7px;height:7px;border-radius:50%;background:#4fd1a5;box-shadow:0 0 0 4px rgba(79,209,165,.22)}
h1{margin:8px 0 4px;font-size:23px;font-weight:700;letter-spacing:.01em}
.sub{font-size:12.5px;color:#b9d5e8}
.stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.stat b{display:block;font-size:20px;font-weight:700;line-height:1.1}
.stat span{font-size:11px;color:#9fc6de;letter-spacing:.04em}

/* ---------- tabs ---------- */
nav.tabs{
  position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);
  backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line);
  margin:0 -14px 14px;
}
nav.tabs .row{display:flex;overflow-x:auto;scrollbar-width:none;max-width:780px;margin:0 auto;padding:0 8px}
nav.tabs .row::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;background:none;border:0;font:inherit;font-size:13.5px;font-weight:600;
  color:var(--ink3);padding:13px 13px 11px;border-bottom:2.5px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button .n{font-size:10.5px;color:var(--ink3);font-weight:500;margin-left:3px}

/* ---------- filters ---------- */
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;
  font-size:12.5px;color:var(--ink2);cursor:pointer;font-weight:500;transition:.15s}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .c{opacity:.6;font-size:11px;margin-left:2px}
/* label for the sort row, so "排序" reads as a label rather than a chip */
.flabel{align-self:center;font-size:11.5px;color:var(--ink3);font-weight:600;
  letter-spacing:.06em;margin-right:1px}
/* the "data updated N minutes ago" stamp, refreshed on every poll */
.fresh{color:var(--accent2);font-weight:600}
.searchrow{display:flex;gap:8px;margin-bottom:14px}
.searchrow input{
  flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;
  font:inherit;font-size:14px;color:var(--ink);min-width:0}
.searchrow input:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(23,98,143,.1)}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
.card h3{margin:0 0 7px;font-size:15.5px;line-height:1.45;font-weight:650;letter-spacing:-.005em}
.card h3 a{color:var(--ink)}
.card h3 a:hover{color:var(--accent2)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:11.5px;color:var(--ink3);margin-bottom:8px}
.badge{display:inline-block;padding:1.5px 7px;border-radius:5px;font-size:10.5px;font-weight:650;letter-spacing:.02em}
.b-pol{background:#e7eff8;color:var(--pol)} .b-eco{background:#e2f2ef;color:var(--eco)}
.b-sec{background:#fbe9e5;color:var(--sec)} .b-ene{background:#faf1dd;color:var(--ene)}
.b-min{background:#efeaf8;color:var(--min)} .b-gen{background:#eef1f4;color:var(--ink2)}
.cty{display:inline-block;padding:1.5px 7px;border-radius:5px;background:#f1f5f8;color:var(--ink2);font-size:10.5px;font-weight:600}
.sum{font-size:13.5px;color:var(--ink2);margin:0 0 9px}
.src{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:11.5px;color:var(--ink3);border-top:1px dashed var(--line2);padding-top:8px;margin-top:2px}
.src .dom{font-weight:600;color:var(--accent2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:11.5px;color:var(--ene);background:#fdf8ec;border-left:2.5px solid #e8c67a;
  padding:6px 9px;border-radius:0 6px 6px 0;margin:8px 0 0}
.note.grey{color:var(--ink3);background:#f4f7f9;border-left-color:#c8d5df}
.pf{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;
  border-radius:6px;padding:2.5px 8px;border:1px solid var(--line);color:var(--ink2);background:#fafcfd}
.pf-x{border-color:#cfe0ec;color:#22506f;background:#f2f8fc}
.pf-li{border-color:#c9d8ea;color:#0a4f8f;background:#f1f6fd}
.pf-fb{border-color:#ccd9e8;color:#1f4f96;background:#f2f6fc}
.pf-ig{border-color:#ecd0d8;color:#9c3b60;background:#fdf3f6}

/* ---------- people table ---------- */
.person{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.person .pn{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.person .nm{font-size:15px;font-weight:650}
.person .rl{font-size:12.5px;color:var(--ink2);margin:3px 0 0}
.person .og{font-size:12.5px;color:var(--accent2);font-weight:600}
.kv{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;font-size:12.5px;margin-top:9px;
  border-top:1px dashed var(--line2);padding-top:9px}
.kv dt{color:var(--ink3);font-weight:600}
.kv dd{margin:0;color:var(--ink2);word-break:break-word}
.duty{font-size:12.5px;color:var(--ink2);line-height:1.65;background:#f6f9fb;
  border:1px solid var(--line2);border-radius:9px;padding:9px 11px;margin-top:9px}
.duty-lb{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:var(--accent2);
  border-radius:4px;padding:1px 6px;margin-right:7px;vertical-align:1.5px;letter-spacing:.04em}
.vok{color:var(--eco);font-weight:650;font-size:11px}
.vno{color:var(--ene);font-weight:650;font-size:11px}
.ttype{display:inline-block;font-size:10px;font-weight:650;padding:1px 6px;border-radius:5px;
  vertical-align:1.5px;margin-left:4px;letter-spacing:.02em}
.t-news{background:#e7eff8;color:var(--pol)} .t-org{background:#e2f2ef;color:var(--eco)}
.t-per{background:#faf1dd;color:var(--ene)} .t-unk{background:#eef1f4;color:var(--ink3)}
.grp{font-size:11.5px;font-weight:700;color:var(--ink3);letter-spacing:.08em;
  margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.grp:before{content:"";width:14px;height:2px;background:var(--line);display:block}

/* priority tiers */
.tier-hd{display:flex;align-items:center;gap:9px;margin:20px 0 4px;padding:9px 13px;
  border-radius:11px;font-weight:700;font-size:14px;letter-spacing:.02em}
.tier-hd .cnt{font-weight:600;font-size:11.5px;opacity:.75;margin-left:auto}
.tier-hd .ico{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;color:#fff;flex:0 0 auto}
.t1{background:linear-gradient(96deg,#fdece9,#fbf5f2);color:#9E2A18}
.t1 .ico{background:#C0392B}
.t2{background:linear-gradient(96deg,#e9f0f9,#f4f7fb);color:#24476E}
.t2 .ico{background:#2F5D8C}
.t3{background:linear-gradient(96deg,#e8f2ec,#f5faf7);color:#1F5E3C}
.t3 .ico{background:#217A4B}
.t4{background:linear-gradient(96deg,#eef1f4,#f7f9fa);color:#465768}
.t4 .ico{background:#6B7C8C}
/* per-module priority groups (see rankOf). p0 = 优先关注, p1 = 其他 */
.p0{background:linear-gradient(96deg,#fdece9,#fbf5f2);color:#9E2A18}
.p0 .ico{background:#C0392B}
.p1{background:linear-gradient(96deg,#eef1f4,#f7f9fa);color:#465768}
.p1 .ico{background:#8B9AA8}
.tier-desc{font-size:11.5px;color:var(--ink3);margin:0 0 10px;padding-left:2px;line-height:1.6}
.tb{display:inline-block;padding:1.5px 7px;border-radius:5px;font-size:10px;font-weight:700;
  letter-spacing:.02em}
.tb1{background:#fbe3de;color:#9E2A18} .tb2{background:#e3ecf7;color:#24476E}
.tb3{background:#dff0e6;color:#1F5E3C}
.tb4{background:#e9edf1;color:#465768}

/* bilingual */
.en-orig{font-size:11.5px;color:var(--ink3);line-height:1.5;margin:5px 0 0;
  padding-left:8px;border-left:2px solid var(--line2);word-break:break-word}
.tl-pending{display:inline-block;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;
  background:#fdf3e3;color:#9A6A12;margin-left:5px;vertical-align:1.5px;letter-spacing:.02em}
.tl-stat{font-size:11.5px;color:var(--ink3);background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:9px 13px;margin-bottom:12px;line-height:1.65}

/* ---------- misc ---------- */
.sec-title{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em;
  margin:20px 0 9px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.sec-title:first-child{margin-top:4px}
.callout{background:#fff;border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:0 10px 10px 0;padding:12px 15px;margin-bottom:12px;box-shadow:var(--shadow)}
.callout h4{margin:0 0 6px;font-size:13px;color:var(--accent)}
.callout ul{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
.callout li{margin-bottom:3px}
.empty{text-align:center;color:var(--ink3);padding:40px 10px;font-size:13.5px}
.pager{display:flex;justify-content:center;gap:10px;align-items:center;margin:16px 0 6px}
.pager button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 16px;
  font:inherit;font-size:13px;color:var(--ink2);cursor:pointer;font-weight:600}
.pager button:disabled{opacity:.4}
footer{max-width:780px;margin:26px auto 0;padding:0 16px;font-size:11px;color:var(--ink3);line-height:1.7}
details.ft{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
details.ft summary{cursor:pointer;color:var(--accent2);font-weight:600;font-size:13px;list-style:none;-webkit-tap-highlight-color:transparent}
details.ft summary::-webkit-details-marker{display:none}
details.ft summary::before{content:'▸ ';color:var(--ink3)}
details.ft[open] summary::before{content:'▾ '}
.ft-body{margin-top:8px;font-size:14px;line-height:1.78;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.ft-note{margin-top:8px;font-size:12px;line-height:1.6;color:var(--ink3);background:#f4f7f9;border-radius:8px;padding:7px 9px}
/* ---------- interactive person lookup ---------- */
.ps-search{display:flex;gap:8px;margin:2px 0 8px}
.ps-search input{flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;
  font-size:15px;background:#fff;color:var(--ink);-webkit-appearance:none}
.ps-search button{flex:0 0 auto;padding:0 18px;border:0;border-radius:10px;background:var(--accent);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.ps-hint{font-size:12px;line-height:1.65;color:var(--ink3);margin:2px 0 10px}
.ps-space{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--ink2);
  background:#f4f7f9;border:1px solid var(--line2);border-radius:9px;padding:7px 10px;margin:0 0 10px}
.ps-space code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--line2);
  border-radius:5px;padding:1px 6px;color:var(--accent);font-size:12px}
.ps-space .ps-note{flex:1 1 100%;color:var(--ink3);line-height:1.55}
.ps-space .ps-clear{margin-left:auto;color:var(--ink3);border-bottom:1px dashed var(--line);
  cursor:pointer;white-space:nowrap}
.ps-space .ps-clear:hover{color:#b3261e;border-color:#b3261e}
.chip em{font-style:normal;font-size:10px;font-weight:700;color:#fff;background:var(--accent2);
  border-radius:4px;padding:1px 4px;margin-right:5px;vertical-align:1px}
.chip i{font-style:normal;font-size:10px;color:var(--ink3);margin-left:5px}
.ps-run{background:#f4f7f9;border-left:3px solid var(--accent2);border-radius:8px;padding:10px 12px;
  font-size:13px;color:var(--ink2);margin-bottom:10px}
.ps-bar{height:5px;background:#dfe8ef;border-radius:99px;overflow:hidden;margin:9px 0 6px}
.ps-bar i{display:block;height:100%;background:var(--accent2);border-radius:99px;transition:width .6s ease}
.ps-err{background:#fdeeee;border-left:3px solid #c0392b;color:#8e2b20;border-radius:8px;
  padding:10px 12px;font-size:13px;line-height:1.65;margin-bottom:10px}
.ps-card h3{margin-top:2px}
.ps-post{border-top:1px dashed var(--line);padding:9px 0 2px;margin-top:6px}
.ps-post-hd{font-size:11.5px;color:var(--ink3);font-weight:600;letter-spacing:.02em}
.caps{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.cap{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 8px;border-radius:999px;
  background:#f4f7f9;color:var(--ink3);border:1px solid var(--line2)}
.cap i{width:6px;height:6px;border-radius:50%;background:#b7c4cf;display:inline-block}
.cap.on{background:#eef7f2;color:#1c6b4b;border-color:#cfe7da}
.cap.on i{background:#2e9e6b}
.cap.off{opacity:.72}
.ft-src{margin-top:8px;font-size:12px}
.plist{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.9}
.plist li a{color:var(--accent2)}
.hide{display:none!important}

@media(max-width:520px){
  h1{font-size:20px} .stats{gap:18px} .stat b{font-size:18px}
  nav.tabs button{padding:12px 11px 10px;font-size:13px}
  .kv{grid-template-columns:56px 1fr}
}
</style>
<style>
/* ── access gate: a rotating dot-matrix globe ──
   The first version was a white card on navy, which read as a form. The reader
   asked for the reference image instead: a dark tech globe. So the gate IS the
   globe — a full-bleed canvas with warm-lit land as a dot matrix, a cyan
   graticule, an orbit ring and a scanning sweep; the passcode sits under it in
   the same palette. Colours are sampled from the reference: #020c1a ground,
   #0a3a48 ocean, #ffe2ba land, #d6fffe accent. */
#gate{position:fixed;inset:0;z-index:9999;overflow:hidden;
  display:flex;flex-direction:column;
  background:radial-gradient(125% 85% at 50% 6%,#0a2334 0%,#061423 42%,#01060d 100%);
  color:#dbe9f4;-webkit-tap-highlight-color:transparent;
  padding:0 max(20px,env(safe-area-inset-left)) 0 max(20px,env(safe-area-inset-right))}
#gateCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#gate{-webkit-user-select:none;user-select:none}
#gateInput{user-select:text;-webkit-user-select:text}
.gwrap{position:relative;z-index:2;display:flex;flex-direction:column;
  flex:1;min-height:0;box-sizing:border-box;
  /* the wrapper spans the whole gate, so it would swallow the drag: nothing
     inside it is interactive except the form */
  pointer-events:none;
  padding-top:max(26px,env(safe-area-inset-top));
  padding-bottom:max(26px,calc(env(safe-area-inset-bottom) + 8px))}
.ghead{text-align:center}
.gbrand{display:inline-flex;align-items:center;gap:8px;
  font-size:11px;letter-spacing:.30em;color:rgba(190,222,244,.9);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.gdot{width:6px;height:6px;border-radius:50%;background:#7fe3ff;
  box-shadow:0 0 8px #7fe3ff,0 0 16px rgba(127,227,255,.55);
  animation:gpulse 2.4s ease-in-out infinite}
@keyframes gpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}
.gslogan{margin-top:10px;font-size:15px;letter-spacing:.16em;
  color:rgba(214,235,250,.72);font-weight:300}
.gbot{margin-top:auto;width:100%;max-width:330px;margin-left:auto;margin-right:auto}
#gateForm{width:100%;pointer-events:auto}
.gin{position:relative;margin-bottom:12px}
#gateInput{width:100%;box-sizing:border-box;padding:15px 16px;
  font-size:17px;letter-spacing:.34em;text-align:center;
  color:#eaf6ff;background:rgba(120,190,230,.07);
  border:1px solid rgba(120,195,235,.26);border-radius:12px;outline:none;
  -webkit-appearance:none;appearance:none;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  transition:border-color .22s,box-shadow .22s,background .22s}
#gateInput::placeholder{letter-spacing:.05em;font-size:13.5px;
  color:rgba(158,196,222,.52);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
#gateInput:focus{border-color:rgba(127,227,255,.78);background:rgba(120,190,230,.12);
  box-shadow:0 0 0 3px rgba(80,180,235,.12),0 0 24px rgba(80,180,235,.22)}
#gateBtn{width:100%;padding:14px;border:0;border-radius:12px;cursor:pointer;
  font-size:15px;font-weight:700;letter-spacing:.24em;color:#02121d;
  background:linear-gradient(100deg,#8fe9ff,#4fb6e8 52%,#2f88c8);
  box-shadow:0 10px 28px rgba(60,160,220,.32),inset 0 1px 0 rgba(255,255,255,.55);
  transition:transform .12s,box-shadow .2s;font-family:inherit}
#gateBtn:active{transform:translateY(1px) scale(.995)}
.gerr{margin-top:11px;min-height:17px;text-align:center;
  font-size:12.5px;color:#ff9b86;letter-spacing:.04em}
.gtip{margin-top:4px;text-align:center;font-size:11.5px;
  color:rgba(150,182,206,.62);letter-spacing:.03em}
body.locked{overflow:hidden}
/* the gate is opaque, so the page behind it is hidden rather than blurred —
   blur would keep repainting content nobody can see */
body.locked > header,body.locked > .wrap,body.locked > footer{visibility:hidden}
/* ── listen (text-to-speech) ──
   Built for walking: one big target, continuous reading, and it keeps going with
   the screen off on Android where MediaSession is available. */
#listen{position:fixed;left:12px;right:12px;bottom:14px;z-index:900;display:none;
  align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
  background:rgba(15,61,92,.96);color:#fff;box-shadow:0 10px 28px rgba(8,30,48,.42);
  backdrop-filter:blur(6px)}
#listen.on{display:flex}
#listen .lt{flex:1;min-width:0}

<body class="locked">
<div id="gate">
  <canvas id="gateCanvas" aria-hidden="true"></canvas>
  <div class="gwrap">
    <div class="ghead">
      <div class="gbrand"><span class="gdot"></span>CHINA EYES</div>
      <div class="gslogan">每日全球动态监测</div>
    </div>
    <div class="gbot">
      <form id="gateForm" autocomplete="off">
        <div class="gin">
          <input id="gateInput" type="password" inputmode="numeric" pattern="[0-9]*"
                 maxlength="12" autocomplete="off" autocapitalize="off"
                 spellcheck="false" enterkeyhint="go" placeholder="请输入访问口令">
        </div>
        <button type="submit" id="gateBtn">进 入</button>
        <div class="gerr" id="gateErr"></div>
        <div class="gtip">口令仅首次需要，验证后自动记住</div>
      </form>
    </div>
  </div>
</div>
<header class="top">
  <div class="inner">
    <div class="brand"><span class="dot"></span>CHINA EYES · 每日更新</div>
    <h1>China Eyes</h1>
    <div class="sub" id="scope">涉华 · 涉美 · 非洲四国 · 中国周边 ｜ 政治 · 经济 · 安全 · 能源 · 矿产</div>
    <div class="stats" id="stats"></div>
  </div>

<div id="listen">
  <div class="lt">
    <div class="ln" id="listenNo">正在朗读</div>
    <div class="ltx" id="listenTxt"></div>

  <button type="button" id="listenRate" class="rate">1.0×</button>
  <button type="button" id="listenPause">暂停</button>
  <button type="button" id="listenStop">结束</button>

<script>
(function(){
  /* ── access gate ─────────────────────────────────────────────────────────
     Two jobs: draw the globe, and check the passcode.

     The passcode is stored as a salted FNV-1a digest rather than as text, so the
     number does not sit in the page source — not cryptography, just no free
     copy-paste. A verified visitor is remembered in localStorage, so the reader
     is asked once and never again ("只需要第一次登录时需要登录口令").

     Honest limit: this runs in the visitor's browser. It deters a forwarded
     link, a crawler or a search engine; it does not stop anyone who opens the
     console or fetches data.js. Real access control needs a server in front. */
  var KEY='ce.gate.v1';
  var WANT='f3837c0d';              // FNV-1a of 'ChinaEyes::' + passcode

  function digest(v){
    var h=0x811c9dc5, t='ChinaEyes::'+v;
    for(var i=0;i<t.length;i++){
      h^=t.charCodeAt(i);
      h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0;
    }
    var o=h.toString(16);
    while(o.length<8) o='0'+o;
    return o;
  }
  function isUnlocked(){
    try{ return localStorage.getItem(KEY)===WANT; }catch(e){ return false; }
  }
  function dropGate(){
    stopAnim();
    var g=document.getElementById('gate');
    if(g&&g.parentNode) g.parentNode.removeChild(g);
    document.body.classList.remove('locked');
  }

  /* This screen now opens EVERY time (reader's request, 2026-10-22):
       · first visit        → globe + passcode field + 进入
       · afterwards         → globe + 进入 only, no field to retype
       · ?gate=1            → force the field back, for checking the flow
     The globe is the landing page, not a one-off prompt, so a returning
     reader still gets one tap and the same pleasant screen instead of a
     bare list. The stored key decides which of the two layouts to build. */
  var FORCE=/(?:^|[?&])gate=1(?:&|$)/.test(location.search||'');
  var UNLOCKED=isUnlocked();
  var NEED_CODE=FORCE||!UNLOCKED;

  /* ── the globe ────────────────────────────────────────────────────────────
     A dot-matrix Earth rather than a picture: ~2600 points sampled evenly over
     the sphere (Fibonacci lattice, so no clustering at the poles), classified
     land or sea, then rotated and projected orthographically every frame.

     Why a canvas: the dots have to pass behind the horizon, fade with depth and
     stay evenly spaced. That is a per-point projection, which is what a canvas
     is for and CSS is not.

     Cost control on phones: the unit-sphere coordinates are computed once, so a
     frame does two sines and cosines plus four multiplies per point; dots are
     1–2px rects rather than arcs; the backing store is capped at DPR 2; and the
     loop is paused whenever the tab is hidden. */
  var cv=document.getElementById('gateCanvas');
  var ctx=cv&&cv.getContext?cv.getContext('2d'):null;
  if(!ctx){ armForm(); return; }     // no canvas: the form must still work

  /* Continents as ellipses of (lat, lon, dlat, dlon). An icon can get away with
     a handful of blobs; this sphere is ~150px across and every dot shows, so the
     set was re-fitted against 38 known land and sea points (Beijing, Brazzaville,
     Cape Town, the Gulf of Guinea, the Sea of Okhotsk …) until land covered ~23%
     of the sphere. The launcher icon's originals left a hole over Mongolia and
     let the Atlantic ellipse eat Brazil — invisible at 32px, obvious here. */
  var LAND=[
    [48,-100,18,26],[35,-95,12,16],[62,-100,12,34],[20,-99,7,9],[64,-150,7,14],[72,-42,8,13],
    [-8,-60,16,13],[-28,-62,12,9],[-20,-66,9,7],[-12,-72,13,7],
    [50,15,10,20],[60,26,10,18],[42,-4,6,9],[55,-3,6,5],[45,20,8,14],
    [5,20,20,17],[25,15,12,20],[-15,25,15,12],[-26,25,8,10],[9,43,9,8],[12,0,10,12],
    [28,45,10,14],
    [46,86,18,34],[30,105,14,22],[56,112,14,33],[24,79,12,11],[15,101,10,10],
    [37,139,7,7],[63,90,10,40],[30,55,10,12],
    [-25,134,12,17],[41,140,4,5]
  ];
  var SEA=[
    [5,-30,32,11],[-25,80,28,22],[36,15,4,13],[20,38,8,2.2],[2,2,5,8],
    [-55,0,10,60],[15,88,7,7],[15,64,9,7],[15,113,8,7],[15,-75,6,9],
    [58,-80,6,8],[57,19,3,4],[43,34,2,5],[41,51,3,2],[26,52,3,3],
    [41,133,4,5],[24,-92,6,7],[55,150,6,10],[30,125,5,6],[-44,19,3,7]
  ];

  function inBlob(lat,lon,b){
    var dy=(lat-b[0])/b[2];
    var dx=Math.abs(((lon-b[1]+180)%360+360)%360-180)/b[3];
    return dx*dx+dy*dy<=1;
  }
  function isLand(lat,lon){
    if(lat<-62) return false;
    var i,hit=false;
    for(i=0;i<LAND.length;i++){ if(inBlob(lat,lon,LAND[i])){ hit=true; break; } }
    if(!hit) return false;
    for(i=0;i<SEA.length;i++){ if(inBlob(lat,lon,SEA[i])) return false; }
    return true;
  }

  var N=2600, PX=[], PY=[], PZ=[], PLAND=[];
  (function build(){
    var ga=Math.PI*(3-Math.sqrt(5));
    for(var i=0;i<N;i++){
      var y=1-(i/(N-1))*2;
      var r=Math.sqrt(Math.max(0,1-y*y));
      var th=ga*i;
      var x=Math.cos(th)*r, z=Math.sin(th)*r;
      PX.push(x); PY.push(y); PZ.push(z);
      var lat=Math.asin(Math.max(-1,Math.min(1,y)))*180/Math.PI;
      var lon=Math.atan2(z,x)*180/Math.PI;
      PLAND.push(isLand(lat,lon));
    }
  })();

  /* Beijing and the four capitals this monitor actually watches: the one place
     on this screen where the brand and the data meet. */
  var PINS=[[39.9,116.4],[9.06,7.49],[13.5,2.1],[12.6,-8.0],[5.6,-0.19]];
  var PINS3=PINS.map(function(p){
    var la=p[0]*Math.PI/180, lo=p[1]*Math.PI/180;
    return [Math.cos(la)*Math.cos(lo),Math.sin(la),Math.cos(la)*Math.sin(lo)];
  });

  var W=0,H=0,CX=0,CY=0,R=0,DPR=1;
  var yaw=0.42, tilt=-0.30, spin=0.0038, drag=null, vel=0, last=0, raf=0;
  var STARS=[];
  var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2);
    W=cv.clientWidth||window.innerWidth;
    H=cv.clientHeight||window.innerHeight;
    cv.width=Math.max(1,Math.round(W*DPR));
    cv.height=Math.max(1,Math.round(H*DPR));
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX=W/2;
    /* The globe owns the upper part of the screen; the form sits under it. The
       radius is derived from whatever is left so a short phone does not push the
       sphere into the input. */
    var formH=Math.min(214,H*0.30);
    var avail=H-formH-Math.max(92,H*0.09);
    CY=Math.max(avail*0.54,86);
    R=Math.max(62,Math.min(W*0.385,avail*0.47,176));
    STARS=[];
    var n=Math.round(W*H/11000);
    for(var i=0;i<n;i++){
      STARS.push({x:Math.random()*W,y:Math.random()*H,
        r:Math.random()<0.86?1:1.6,
        a:0.10+Math.random()*0.50,
        ph:Math.random()*6.2832,
        sp:0.4+Math.random()*1.1});
    }
  }

  function project(lat,lon,cy_,sy_,ct,st){
    var la=lat*Math.PI/180, lo=lon*Math.PI/180;
    var x=Math.cos(la)*Math.cos(lo), y=Math.sin(la), z=Math.cos(la)*Math.sin(lo);
    var x1=x*cy_+z*sy_;
    var z1=-x*sy_+z*cy_;
    var y2=y*ct-z1*st;
    var z2=y*st+z1*ct;
    return [CX+x1*R*0.999,CY-y2*R*0.999,z2];
  }

  function draw(t){
    var i,j;
    ctx.clearRect(0,0,W,H);

    /* stars */
    for(i=0;i<STARS.length;i++){
      var s=STARS[i];
      var a=s.a*(0.62+0.38*Math.sin(t*s.sp+s.ph));
      ctx.fillStyle='rgba(198,226,246,'+a.toFixed(3)+')';
      ctx.fillRect(s.x,s.y,s.r,s.r);
    }

    /* halo, so the sphere sits in the dark instead of on it */
    var halo=ctx.createRadialGradient(CX,CY,R*0.72,CX,CY,R*1.5);
    halo.addColorStop(0,'rgba(38,150,200,0.20)');
    halo.addColorStop(0.55,'rgba(24,96,140,0.09)');
    halo.addColorStop(1,'rgba(4,16,28,0)');
    ctx.fillStyle=halo;
    ctx.beginPath(); ctx.arc(CX,CY,R*1.5,0,6.2832); ctx.fill();

    /* ocean disc, darker than the page so the limb reads as an edge */
    var oc=ctx.createRadialGradient(CX-R*0.28,CY-R*0.32,R*0.1,CX,CY,R);
    oc.addColorStop(0,'rgba(18,64,86,0.92)');
    oc.addColorStop(0.62,'rgba(9,42,60,0.92)');
    oc.addColorStop(1,'rgba(4,20,32,0.95)');
    ctx.fillStyle=oc;
    ctx.beginPath(); ctx.arc(CX,CY,R,0,6.2832); ctx.fill();

    var cy_=Math.cos(yaw), sy_=Math.sin(yaw);
    var ct=Math.cos(tilt), st=Math.sin(tilt);
    var cr=R*0.999;

    /* graticule, front hemisphere only; skipped when small, where the lines
       merge into a grey smear */
    if(R>92){
      ctx.lineWidth=1;
      ctx.strokeStyle='rgba(120,196,232,0.13)';
      var lat,lon,first,pr;
      for(lat=-60;lat<=60;lat+=30){
        first=true; ctx.beginPath();
        for(lon=-180;lon<=180;lon+=6){
          pr=project(lat,lon,cy_,sy_,ct,st);
          if(pr[2]<=0.02){ first=true; continue; }
          if(first){ ctx.moveTo(pr[0],pr[1]); first=false; } else ctx.lineTo(pr[0],pr[1]);
        }
        ctx.stroke();
      }
      for(lon=-180;lon<180;lon+=30){
        first=true; ctx.beginPath();
        for(lat=-88;lat<=88;lat+=6){
          pr=project(lat,lon,cy_,sy_,ct,st);
          if(pr[2]<=0.02){ first=true; continue; }
          if(first){ ctx.moveTo(pr[0],pr[1]); first=false; } else ctx.lineTo(pr[0],pr[1]);
        }
        ctx.stroke();
      }
    }

    /* the dot matrix: warm land, faint cyan sea */
    for(i=0;i<N;i++){
      var x=PX[i]*cy_+PZ[i]*sy_;
      var z0=-PX[i]*sy_+PZ[i]*cy_;
      var y=PY[i]*ct-z0*st;
      var z=PY[i]*st+z0*ct;
      if(z<=0.03) continue;                    // behind the horizon
      var sx=CX+x*cr, sy2=CY-y*cr;
      var e=z*z;
      if(PLAND[i]){
        ctx.fillStyle='rgba(255,226,186,'+(0.30+0.66*e).toFixed(3)+')';
        var sz=z>0.55?1.9:1.5;
        ctx.fillRect(sx,sy2,sz,sz);
      } else {
        ctx.fillStyle='rgba(130,200,232,'+(0.055+0.20*e).toFixed(3)+')';
        ctx.fillRect(sx,sy2,1.1,1.1);
      }
    }

    /* scan sweep — the one overtly digital gesture, and the cheapest */
    if(!reduce){
      var yy=CY+((t*46)%(2.35*R)-1.18*R);
      var half=R*0.30;
      ctx.save();
      ctx.beginPath(); ctx.arc(CX,CY,R,0,6.2832); ctx.clip();
      var lg=ctx.createLinearGradient(0,yy-half,0,yy+half);
      lg.addColorStop(0,'rgba(140,232,255,0)');
      lg.addColorStop(0.5,'rgba(140,232,255,0.11)');
      lg.addColorStop(1,'rgba(140,232,255,0)');
      ctx.fillStyle=lg;
      ctx.fillRect(CX-R,yy-half,R*2,half*2);
      ctx.restore();
    }

    /* limb */
    ctx.strokeStyle='rgba(150,222,250,0.55)';
    ctx.lineWidth=1.15;
    ctx.beginPath(); ctx.arc(CX,CY,R,0,6.2832); ctx.stroke();
    ctx.strokeStyle='rgba(127,227,255,0.16)';
    ctx.lineWidth=3.4;
    ctx.beginPath(); ctx.arc(CX,CY,R-1.7,0,6.2832); ctx.stroke();

    /* orbit ring with a travelling node */
    var orb=ctx.createLinearGradient(CX-R*1.5,CY,CX+R*1.5,CY);
    orb.addColorStop(0,'rgba(127,227,255,0)');
    orb.addColorStop(0.5,'rgba(127,227,255,0.30)');
    orb.addColorStop(1,'rgba(127,227,255,0)');
    ctx.save();
    ctx.translate(CX,CY);
    ctx.rotate(-0.42);
    ctx.strokeStyle=orb; ctx.lineWidth=1;
    ctx.beginPath();
    if(ctx.ellipse) ctx.ellipse(0,0,R*1.34,R*0.34,0,0,6.2832);
    else ctx.arc(0,0,R*1.1,0,6.2832);
    ctx.stroke();
    if(!reduce){
      var ao=t*0.55;
      var nx=Math.cos(ao)*R*1.34, ny=Math.sin(ao)*R*0.34;
      var ga2=0.25+0.75*Math.abs(Math.sin(ao));
      ctx.fillStyle='rgba(180,240,255,'+ga2.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(nx,ny,1.9,0,6.2832); ctx.fill();
      ctx.fillStyle='rgba(127,227,255,'+(ga2*0.22).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(nx,ny,5.2,0,6.2832); ctx.fill();
    }
    ctx.restore();

    /* watched cities */
    for(j=0;j<PINS3.length;j++){
      var q=PINS3[j];
      var px=q[0]*cy_+q[2]*sy_;
      var pz=-q[0]*sy_+q[2]*cy_;
      var py=q[1]*ct-pz*st;
      var pzz=q[1]*st+pz*ct;
      if(pzz<=0.16) continue;
      var mx=CX+px*cr, my=CY-py*cr;
      var ph=(t*0.75+j*1.3)%1;
      ctx.fillStyle='rgba(127,227,255,'+(0.85*pzz).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(mx,my,1.55,0,6.2832); ctx.fill();
      ctx.strokeStyle='rgba(127,227,255,'+((1-ph)*0.45*pzz).toFixed(3)+')';
      ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(mx,my,2+ph*9,0,6.2832); ctx.stroke();
    }
  }

  function frame(now){
    if(!last) last=now;
    var dt=Math.min(0.05,(now-last)/1000);
    last=now;
    if(drag===null){
      if(Math.abs(vel)>0.00008){ yaw+=vel; vel*=0.94; }   // inertia after a flick
      else if(!reduce) yaw+=spin*dt*60;
    }
    draw(now/1000);
    raf=requestAnimationFrame(frame);
  }
  function startAnim(){ if(raf) return; last=0; raf=requestAnimationFrame(frame); }
  function stopAnim(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }

  /* drag to spin — "可以滚动的地球" */
  var px0=0,py0=0;
  cv.addEventListener('pointerdown',function(e){
    drag=1; px0=e.clientX; py0=e.clientY; vel=0;
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
  });
  cv.addEventListener('pointermove',function(e){
    if(drag===null) return;
    var dx=e.clientX-px0, dy=e.clientY-py0;
    px0=e.clientX; py0=e.clientY;
    yaw+=dx*0.0075;
    tilt=Math.max(-1.15,Math.min(1.15,tilt+dy*0.005));
    vel=dx*0.0035;
  });
  function endDrag(){ drag=null; }
  cv.addEventListener('pointerup',endDrag);
  cv.addEventListener('pointercancel',endDrag);
  cv.addEventListener('pointerleave',function(){ if(drag!==null) endDrag(); });

  /* an idle animation must not burn a phone battery behind a backgrounded tab */
  document.addEventListener('visibilitychange',function(){
    if(document.hidden) stopAnim(); else startAnim();
  });
  var rt=0;
  window.addEventListener('resize',function(){
    clearTimeout(rt); rt=setTimeout(resize,120);
  });

  /* ── the passcode ─────────────────────────────────────────────────────── */
  var wired=false;
  function armForm(){
    var f=document.getElementById('gateForm');
    var inp=document.getElementById('gateInput');
    var err=document.getElementById('gateErr');
    if(!f||!inp||wired) return;
    wired=true;
    if(!NEED_CODE){
      /* Already verified on this device: hide the field entirely and let the
         single button open the app. Retyping a passcode that is already
         stored would be pure friction. */
      var gi=document.querySelector('#gate .gin');
      if(gi) gi.style.display='none';
      var gp=document.querySelector('#gate .gtip');
      if(gp) gp.textContent='本机已通过验证';
    } else {
      setTimeout(function(){ try{ inp.focus(); }catch(e){} },260);
    }
    /* Say it here rather than only in the footer. If the link arrived through
       WeChat, the reader is one tap from giving up on installing, and the
       reason is invisible: WeChat's WebView has no add-to-home-screen. */
    (function envTip(){
      var ua=navigator.userAgent||'';
      if(!/MicroMessenger|QQ\//i.test(ua)) return;
      var g=document.querySelector('#gate .gtip');
      if(!g) return;
      g.innerHTML='当前在微信内打开，无法安装到桌面<br>请点右上角 ··· → 在浏览器打开';
      g.style.color='rgba(255,206,140,.92)';
    })();
    f.addEventListener('submit',function(e){
      e.preventDefault();
      if(!NEED_CODE){ dropGate(); return; }
      var v=(inp.value||'').replace(/\s/g,'');
      if(digest(v)===WANT){
        /* a forced preview must not convert itself into a real login */
        if(!FORCE){ try{ localStorage.setItem(KEY,WANT); }catch(e1){} }
        dropGate();
      }else{
        err.textContent='口令不正确';
        inp.value='';
        try{ inp.focus(); }catch(e2){}
      }
    });
  }

  resize();
  startAnim();
  if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded',armForm);
  }else{
    armForm();
  }
})();
</script>
<script>
/* Register the service worker. This is what turns "添加到主屏幕" into a real
   installable app on Android: Chrome requires a manifest, 192/512 icons and a
   registered worker with a fetch handler, and without the worker it silently
   falls back to a plain bookmark. iOS ignores this and uses the apple-* meta
   tags, which are already in the head. */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js",{scope:"./"}).catch(function(){});
  });
}
</script>
<script src="data.js" onerror="window.__DATA_MISSING__=1"></script>
<script>
(function(){
  var D = window.SITE_DATA || null;
  var PAGE = 12;
  /* Static snapshot mode. The library-hosted build inlines the data and has no
     backend, so the poll loop and the two live-search tabs are switched off
     instead of firing requests that can only 404. */
  var STATIC = !!window.__STATIC__;

  /* ── my own search space ────────────────────────────────────────────────
     "Give everyone who opens this link their own space, so my records are
     invisible to others." The browser mints a random id once and keeps it in
     localStorage + a first-party cookie; every API call carries it, and the
     server stores that visitor's history and caches under it. No account, no
     password. Clearing site data gives you a brand-new empty space. */
  var CID = (function(){
    var k = 'ae_cid', v = '';
    try { v = localStorage.getItem(k) || ''; } catch(e){}
    if(!v || !/^[0-9a-f]{16,32}$/.test(v)){
      var a = new Uint8Array(10);
      (window.crypto && crypto.getRandomValues) ? crypto.getRandomValues(a)
        : a.forEach(function(_,i){ a[i] = Math.floor(Math.random()*256); });
      v = Array.prototype.map.call(a, function(b){ return ('0'+b.toString(16)).slice(-2); }).join('');

  // ---------- filtering ----------

         search. "Niger" must not return Nigeria, and it must not be satisfied
         by a Nigerian item whose body mentions Niger. */
      if(rq.cty && (it.country||[]).indexOf(rq.cty)<0) return false;
      if(rq.words.length){
        var hay=[it.title,it.title_zh,it.summary,it.summary_zh,it.snippet,it.snippet_zh,it.body,it.body_zh,
                 it.source,it.author,it.handle,it.actor,
                 (it.topic||[]).join(' '),(it.country||[]).join(' ')].join(' ').toLowerCase();

  function emptyTierNote(t){

    if(typeof it._dt==='number') return it._dt;

  function cardList(items, cardFn){

    if(!slice.length) return '<div class="empty">当前筛选条件下没有条目。请放宽层级、国家或领域筛选。</div>';

    slice.forEach(function(i){

  /* Collapsible full text — present on EVERY card, without exception.

  /* Collapsible full text — Chinese only, never a raw English panel.

               +'需要完整内容可点下方原文链接。</div>';

        txt='该条译文正在生成，下一轮自动更新后显示中文全文。';

      V.innerHTML=h; return;
    }
    /* The four axis modules: 涉华 / 涉美 / 非洲四国 / 周边国家.
       Each module is a unified news + social feed filtered by its axis. */
    if(state.view==='china' || state.view==='us' || state.view==='africa' || state.view==='periphery'){
      var mod = state.view;
      var inModAll = (D.news||[]).concat(D.social||[]).filter(function(it){return inModule(it,mod);});
      var pool = inModAll;
      var newsFiltered = (D.news||[]).filter(function(it){return inModule(it,mod) && match(it);});
      var socFiltered  = (D.social||[]).filter(function(it){return inModule(it,mod) && match(it);});
      var newsInMod    = (D.news||[]).filter(function(it){return inModule(it,mod);});
      var socInMod     = (D.social||[]).filter(function(it){return inModule(it,mod);});
      var moduleLabel  = {'china':'涉华动态','us':'涉美动态','africa':'非洲四国','periphery':'周边国家'}[mod];
      var moduleNote   = {'china':'涉及中国人、中国企业或中国项目的报道与社交动态，跨全部 12 个监测国。',
                          'us':'涉及美国在监测区域活动的报道与社交动态（政府、军方、企业、援助机构）。',
                          'africa':'发生在尼日利亚、尼日尔、马里、加纳的报道与社交动态，含各政府、中国、美国、恐怖组织及其他各方。',
                          'periphery':'发生在中国周边国家（朝鲜/韩国、菲律宾、缅甸、俄罗斯、印度、尼泊尔、越南、老挝）的报道与社交动态。'}[mod];
      var unifiedCard = function(it){ return it.platform ? cardSocial(it) : cardNews(it); };
      /* Per-module priority ordering (see rankOf). Within each rank the feed is
         newest-first, so the reader's "最新排最前" rule still applies. */
      var merged = orderModule(newsFiltered.concat(socFiltered), mod);
      var prioN  = state.sort==='prio'
        ? merged.filter(function(i){return i._rk===0;}).length : 0;
      var prioHint = {'china':'涉华主体优先：中国人、中国企业、中国项目在前，其他涉华报道在后。',
                      'us':'美国 × 尼日利亚·尼日尔·马里·加纳的互动在前，美国在其他方向的活动在后。',
                      'africa':'涉华主体、以及美方在四国可能带来负面影响的「小动作」在前，其余在后。',
                      'periphery':'涉华、涉美的互动在前，其余周边动态在后。'}[mod];
      var section = '<div class="sec-title">'+moduleLabel+'　·　'+newsFiltered.length+' 条新闻 + '+socFiltered.length+' 条动态'
        +(prioN?'　·　<span style="color:var(--accent2)">优先 '+prioN+' 条</span>':'')+'</div>'
        + '<div class="note grey">'+moduleNote+'</div>'
        + (state.sort==='prio'
            ? '<div class="note grey" style="color:var(--ink2)"><b>阅读顺序：</b>'+prioHint
              + '每组内部按发布时间倒序，最新在上；条目自发布起保留 '+(D.windowDays||3)+' 天，超期即被新内容替换。</div>'
            : '')
        + (merged.length
            ? cardList(merged, unifiedCard)
            : '<div class="empty">本模块近 '+(D.windowDays||3)+' 日内没有匹配条目。可放宽国家、领域筛选或更换关键词。</div>');
      V.innerHTML = tierBar(newsInMod.concat(socInMod)) + sortBar()
        + filterBar(newsInMod.concat(socInMod))
        + listenBtnHtml(merged.length) + section
        + '<div class="note">平台可得性：X 可获取帖文正文；LinkedIn / Facebook / Instagram 上游仅返回标题与摘要（约 140 字符），无法取得正文，请点击原帖查看完整内容。</div>';
      bindListen(merged);
    } else if(state.view==='people'){
      var all=D.people||[];
      var ppl=all.filter(function(p){
        if(state.cty!=='all' && (p.country||[]).indexOf(state.cty)<0) return false;
        if(state.q){
          var hay=[p.name,p.role,p.org,p.basis,p.contact,p.roleHint,(p.profiles||[]).map(function(q){return q.handle;}).join(' ')].join(' ').toLowerCase();
          if(hay.indexOf(state.q.toLowerCase())<0) return false;}
        return true;});
      var all12 = AFRICA_CTYS.concat(PERIPHERY_CTYS);
      var hh='<div class="filters"><span class="chip'+(state.cty==='all'?' on':'')+' data-k="cty" data-v="all">全部国家<span class="c">'+all.length+'</span></span>';
      all12.forEach(function(c){
        var n=all.filter(function(p){return (p.country||[]).indexOf(c)>=0;}).length;
        if(!n)return;
        hh+='<span class="chip'+(state.cty===c?' on':'')+'" data-k="cty" data-v="'+c+'">'+CNAMES[c]+'<span class="c">'+n+'</span></span>';});
      hh+='</div><div class="searchrow"><input id="q" type="search" placeholder="搜索姓名、机构、职务…" value="'+esc(state.q)+'"></div>';
      var gt={媒体机构:'媒体机构 · 报道发布方',机构:'机构与组织账号',个人:'个人账号',未确定:'主体性质待核验'};
      var body='';
      ['媒体机构','机构','个人','未确定'].forEach(function(t){
        var sub=ppl.filter(function(p){return p.type===t;});
        if(!sub.length)return;
        body+='<div class="grp">'+gt[t]+'（'+sub.length+'）</div>'+sub.map(cardPerson).join('');
      });
      V.innerHTML = hh + '<div class="sec-title">公开信息发布者索引</div>'
        + (body || '<div class="empty">没有匹配的人员或机构条目。</div>')
        + '<div class="note grey">收录口径：只收录在公开渠道以职务或公开账号身份发布相关信息的个人与机构，字段限于姓名／账号、职务或身份、所属机构、公开档案链接与机构对外联络页。'
        + '个人私人联系方式（手机号、私人邮箱、住址）不采集、不展示、不推断；需要联系时请经由其所属机构公开的对外联络渠道。'
        + '「机构／个人」由账号名称特征规则区分，少数条目可能归错，请以公开档案页为准。</div>';
    } else if(state.view==='sources'){
      var sources={};
      (D.news||[]).forEach(function(it){
        var d=host(it.url); if(!d)return;
        sources[d]=(sources[d]||0)+1;
      });
      var rows=Object.keys(sources).sort(function(a,b){return sources[b]-sources[a];});
      var h2='<div class="sec-title">信源清单（本批共 '+rows.length+' 个媒体域名）</div>';
      h2+='<div class="note grey">下列域名均为本期实际抓取到的报道来源，按出现频次倒序。点击域名可在新窗口打开主页。</div>';
      h2+='<div class="filters"><span class="chip on">全部</span></div>';
      h2+=rows.map(function(d){
        var o=D.outletLabel&&D.outletLabel[d];
        return '<div class="note grey" style="margin:5px 0;padding:8px 12px"><b style="color:var(--accent2)">'+esc(d)+'</b>　·　'
          +(o?esc(o)+'　·　':'')+esc(sources[d])+' 条</div>';
      }).join('') || '<div class="empty">本批无信源数据。</div>';
      V.innerHTML=h2;
    }

    // chips + search wiring
    V.querySelectorAll('.chip').forEach(function(c){
      if(!c.dataset.k) return;      // action chips (retry / recent query) wire themselves
      c.addEventListener('click',function(){
        state[c.dataset.k]=c.dataset.v; state.page=1; render();});});
    var qi=V.querySelector('#q');
    if(qi){
      /* Chinese input must survive the re-render.
         The old handler re-rendered the whole view 320 ms after every `input`
         event, which REPLACED the input element. With an IME that session is
         what turns pinyin into characters: destroying the field mid-composition
         threw the buffer away, so nothing was ever committed and the box looked
         as if it only accepted English. English has no composition session, so
         it looked fine — the bug was invisible until someone typed Chinese.

         Fix: never touch the DOM while a composition is in progress, and after
         it ends apply the value. `isComposing` / keyCode 229 catch the mobile
         and desktop IME cases that do not fire compositionend reliably. */
      var t, composing=false;
      var apply=function(){
        state.q=qi.value; state.page=1;
        var pos=qi.value.length;
        render();
        var n=document.getElementById('q');
        if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}
      };
      qi.addEventListener('compositionstart',function(){composing=true;});
      qi.addEventListener('compositionend',function(){
        composing=false; clearTimeout(t);
        t=setTimeout(apply,60);
      });
      qi.addEventListener('input',function(e){
        if(composing || e.isComposing || e.keyCode===229) return;   // mid-IME
        clearTimeout(t);
        t=setTimeout(apply,320);
      });
      /* Enter applies immediately — on a phone keyboard the confirm key is the
         natural "search" gesture, and waiting 320 ms feels broken. */
      qi.addEventListener('keydown',function(e){
        if(e.key==='Enter'||e.keyCode===13){
          if(composing||e.isComposing) return;
          clearTimeout(t); apply();
        }
      });
    }
    V.querySelectorAll('.pager button').forEach(function(b){
      b.addEventListener('click',function(){if(b.disabled)return;state.page=+b.dataset.p;render();
        window.scrollTo({top:0,behavior:'smooth'});});});
  }

  /* ── listen: read the visible list aloud ──
     The reader walks and wants the day's items in his ears, so this reads the
     CURRENT filtered list — filter to 涉华, tap 朗读, and he hears exactly those
     cards, in the order they are on screen.

     Details that matter on a phone:
     · it re-reads from the list each time rather than caching, so a live refresh
       mid-listen does not resurrect stale items;
     · it strips the things a person would not read aloud — the outlet name in
       brackets, "展开全文", the URL, the emoji badges;
     · a long summary is cut at a sentence boundary, because a 500-character read
       per card turns a 20-card list into an hour;
     · MediaSession keeps the tab alive in the background on Android, and the
       pause/resume buttons drive the same queue. */
  var SPEAK = {idx:0, list:[], rate:1.0, paused:false, active:false, voice:null};

  function speakText(it){
    var t = it.title_zh || it.title || '';
    var s = it.summary_zh || it.summary || it.snippet_zh || it.snippet || '';
    t = String(t).replace(/\s*[|｜]\s*[^|｜]{2,24}$/, '')
           .replace(/[（(]\s*(更新|视频|图)[^）)]*[）)]/g, '').trim();
    s = String(s)
      /* A source clause reads terribly aloud: "据 africa.com 报道：" becomes
         "ju africa dot com baodao". Strip the whole phrase, not just the host. */
      .replace(/据[^，。；]{2,26}(?:报道|消息|称|显示)[：:，,]?/g, '')
      .replace(/(?:according to|reports? say|reported by)\s+[A-Za-z0-9.\-]+/gi, '')
      .replace(/(?:https?:\/\/|www\.)\S+/g, '')
      .replace(/\b[A-Za-z0-9\-]+\.(?:com|ng|gh|org|net|co|uk|fr|de|info|news|tv)\b/gi, '')
      .replace(/展开全文|打开原文|点击查看|阅读更多|Read more/gi, '')
      .replace(/\s+/g, ' ').trim();
    /* The translator often restates the headline as the first clause of the
       summary. Reading both sounds like a stutter, so drop the repeat. */
    var norm = function(x){ return String(x).replace(/[，。、；：！？\s]/g, ''); };
    if(norm(s).slice(0,12) === norm(t).slice(0,12)){
      var cut = s.search(/[。！？]/);
      if(cut >= 0) s = s.slice(cut + 1).replace(/^[，,、\s]+/, '');
    }
    /* Two sentences: enough to decide whether to look at the card. */
    var parts = s.match(/[^。！？.!?]+[。！？.!?]?/g) || [];
    var brief = parts.slice(0, 2).join('').trim();
    if(brief.length > 180) brief = brief.slice(0, 180);
    return (t ? t + '。' : '') + (brief || '');
  }

  function pickVoice(){
    try{
      var vs = window.speechSynthesis.getVoices() || [];
      /* Prefer a mainland Mandarin voice; fall back to any zh-*. */
      var zh = vs.filter(function(v){return /^zh/i.test(v.lang);});
      var cn = zh.filter(function(v){return /(zh[-_]CN|Chinese|Mandarin|Xiaoxiao|Yunxi|Huihui|Tingting|Kangkang)/i.test(v.name+' '+v.lang);});
      SPEAK.voice = cn[0] || zh[0] || null;
    }catch(e){ SPEAK.voice = null; }
  }

  function speakShow(){
    var bar = document.getElementById('listen');
    if(!bar) return;
    if(!SPEAK.active){ bar.classList.remove('on'); return; }
    bar.classList.add('on');
    var n = document.getElementById('listenNo');
    var tx = document.getElementById('listenTxt');
    if(n) n.textContent = '正在朗读 ' + (SPEAK.idx+1) + ' / ' + SPEAK.list.length;
    if(tx) tx.textContent = speakText(SPEAK.list[SPEAK.idx] || {});
  }

  function speakNext(){
    if(!SPEAK.active) return;
    if(SPEAK.idx >= SPEAK.list.length){ speakStop(); return; }
    speakShow();
    var it = SPEAK.list[SPEAK.idx];
    var body = speakText(it);
    if(!body){ SPEAK.idx++; return setTimeout(speakNext, 30); }
    var u = new SpeechSynthesisUtterance(body);
    u.lang = 'zh-CN';
    u.rate = SPEAK.rate;
    u.pitch = 1.0;
    if(SPEAK.voice) u.voice = SPEAK.voice;
    u.onend = function(){
      if(!SPEAK.active) return;
      SPEAK.idx++;
      setTimeout(speakNext, 260);        // a beat between cards
    };
    u.onerror = function(){
      if(SPEAK.active){ SPEAK.idx++; setTimeout(speakNext, 200); }
    };
    try{ window.speechSynthesis.speak(u); }catch(e){ speakStop(); }
  }

  function speakStart(list){
    if(!('speechSynthesis' in window)){ alert('这个浏览器不支持朗读。'); return; }
    speakStop();
    SPEAK.list = (list || []).slice(0, 60);   // an hour of audio is plenty
    if(!SPEAK.list.length) return;
    SPEAK.idx = 0; SPEAK.active = true; SPEAK.paused = false;
    pickVoice();
    var b = document.getElementById('listenPause'); if(b) b.textContent = '暂停';
    /* Keep audio alive when the screen locks. */
    try{
      if('mediaSession' in navigator){
        navigator.mediaSession.metadata = new MediaMetadata({
          title:'China Eyes 播报', artist:'每日动态'});
        navigator.mediaSession.setActionHandler('pause', function(){ speakPause(); });
        navigator.mediaSession.setActionHandler('play', function(){ speakPause(); });
        navigator.mediaSession.setActionHandler('stop', function(){ speakStop(); });
      }
    }catch(e){}
    speakNext();
  }

  function speakStop(){
    SPEAK.active = false; SPEAK.paused = false; SPEAK.list = []; SPEAK.idx = 0;
    try{ window.speechSynthesis.cancel(); }catch(e){}
    var bar = document.getElementById('listen'); if(bar) bar.classList.remove('on');
  }

  function speakPause(){
    if(!SPEAK.active) return;
    if(SPEAK.paused){
      SPEAK.paused = false;
      try{ window.speechSynthesis.resume(); }catch(e){}
      var b = document.getElementById('listenPause'); if(b) b.textContent = '暂停';
    } else {
      SPEAK.paused = true;
      try{ window.speechSynthesis.pause(); }catch(e){}
      var b2 = document.getElementById('listenPause'); if(b2) b2.textContent = '继续';
    }
  }

  function listenBtnHtml(n){
    if(!('speechSynthesis' in window)) return '';
    return '<div class="filters" style="margin-top:-2px">'
      + '<span class="listenbtn" id="listenStart"><span class="ico">▶</span>朗读本页（'+Math.min(n,60)+' 条）</span>'
      + '</div>';
  }

  function bindListen(list){
    var b = document.getElementById('listenStart');
    if(b) b.addEventListener('click', function(){ speakStart(list); });
    var r = document.getElementById('listenRate');
    if(r) r.addEventListener('click', function(){
      var seq = [1.0, 1.25, 1.5, 0.9];
      SPEAK.rate = seq[(seq.indexOf(SPEAK.rate)+1) % seq.length];
      r.textContent = SPEAK.rate.toFixed(2).replace(/0$/,'') + '×';
      if(SPEAK.active){                       // restart current card at new speed
        try{ window.speechSynthesis.cancel(); }catch(e){}
        setTimeout(speakNext, 80);
      }
    });
    var pz = document.getElementById('listenPause');
    if(pz) pz.addEventListener('click', speakPause);
    var st = document.getElementById('listenStop');
    if(st) st.addEventListener('click', speakStop);
    /* Some browsers populate the voice list late. */
    try{ window.speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
  }

  chrome();
  render();

  // ── live refresh ──────────────────────────────────────────────────────────
  // Re-read data.js on a short timer so a rebuild reaches the phone by itself.
  // This is a plain file fetch — it costs no API credits.
  //
  // The earlier version called location.reload(), which threw away the reader's
  // scroll position and any open filter every time new data landed — so on a
  // page that refreshes often it felt like the site was fighting them. This one
  // swaps the data in place and puts the reader back on the card they were
  // looking at.
  var LIVE_MS=60*1000;
  var lastGen=D.generatedAt||'';

  function parseData(t){
    var i=t.indexOf('{'), j=t.lastIndexOf('}');
    if(i<0||j<=i) return null;
    try{ return JSON.parse(t.slice(i,j+1)); }catch(e){ return null; }
  }
  // The topmost card still substantially on screen — the reader's place.
  function anchorKey(){
    var cards=document.querySelectorAll('#view .card');
    for(var i=0;i<cards.length;i++){
      if(cards[i].getBoundingClientRect().bottom>72)
        return cards[i].getAttribute('data-k');
    }
    return '';
  }
  function restoreAnchor(k){
    if(!k) return;
    var el=document.querySelector('#view .card[data-k="'+k+'"]');
    if(!el) return;
    window.scrollTo(0,Math.max(0,el.getBoundingClientRect().top+window.pageYOffset-72));
  }
  function refreshFresh(){
    var el=document.querySelector('.fresh');
    if(el) el.textContent=freshText();
  }

  /* Cheap check first: /version returns a few dozen bytes, so a minute-by-minute
     poll costs almost nothing even on mobile data. Only when the build stamp
     actually moves does the full data.js get pulled — it carries every article
     body and is a few hundred KB. Falls back to the old whole-file poll when
     /version is unavailable (e.g. a plain static host). */
  /* "3 分钟" / "2 小时 10 分" / "1 天 4 小时" — a raw minute count reads badly
     once the sandbox has been asleep overnight. */
  function ageText(m){
    m=Math.max(0,Math.round(m||0));
    if(m<60) return m+' 分钟';
    if(m<1440){
      var h=Math.floor(m/60), r=m%60;
      return h+' 小时'+(r?' '+r+' 分':'');
    }
    var d=Math.floor(m/1440), hh=Math.floor((m%1440)/60);
    return d+' 天'+(hh?' '+hh+' 小时':'');
  }

  function poll(){
    if(STATIC||document.hidden) return;
    fetch('version?_='+Date.now(),{cache:'no-store'})
      .then(function(r){
        if(!r.ok) throw new Error('no version endpoint');
        return r.json();
      })
      .then(function(v){
        /* The status line that used to be written here was removed at the
           reader's request — the page should say what it found, not how it is
           kept up to date. Only the version check below still matters. */
        if(v && v.generatedAt){
          if(v.generatedAt===lastGen){ refreshFresh(); return; }
          pullFull();
          return;
        }
        pullFull();
      })
      .catch(function(){ pullFull(); });
  }
  function pullFull(){
    fetch('data.js?_='+Date.now(),{cache:'no-store'})
      .then(function(r){return r.text();})
      .then(function(t){
        var m=t.match(/"generatedAt":\s*"([^"]+)"/);
        if(!m) return;
        if(m[1]===lastGen){ refreshFresh(); return; }   // same build: just re-age the stamp
        var nd=parseData(t);
        if(!nd) return;
        var wasTop=window.pageYOffset<80, key=anchorKey();
        D=nd; lastGen=m[1];
        chrome(); render();
        if(!wasTop) restoreAnchor(key);
      }).catch(function(){});
  }

  setInterval(poll, LIVE_MS);
  // Coming back to a backgrounded tab should show current data immediately
  // rather than after the next tick.
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) poll(); });
  poll();
})();
</script>
</body>
</html>
